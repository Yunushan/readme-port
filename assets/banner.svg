<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ReadmePort banner</title>
  <desc id="desc">A document travelling between five connected code forges</desc>
  <defs>
    <linearGradient id="bg" x1="50" y1="20" x2="1150" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1020"/>
      <stop offset="0.48" stop-color="#14112b"/>
      <stop offset="1" stop-color="#071923"/>
    </linearGradient>
    <linearGradient id="line" x1="250" y1="200" x2="970" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#8b5cf6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="590" cy="180" r="220" fill="url(#halo)"/>
  <path d="M170 212h860" stroke="url(#line)" stroke-width="4" stroke-dasharray="5 14" opacity=".7"/>
  <g fill="#111827" stroke="#36415a" stroke-width="2">
    <rect x="40" y="162" width="110" height="100" rx="20"/>
    <rect x="180" y="162" width="110" height="100" rx="20"/>
    <rect x="320" y="162" width="110" height="100" rx="20"/>
    <rect x="800" y="162" width="110" height="100" rx="20"/>
    <rect x="950" y="162" width="110" height="100" rx="20"/>
  </g>
  <g fill="#b8c3d8" font-family="ui-sans-serif,system-ui" font-size="15" font-weight="700" text-anchor="middle">
    <text x="95" y="219">GitHub</text>
    <text x="235" y="219">GitLab</text>
    <text x="375" y="219">Bitbucket</text>
    <text x="855" y="219">Gitea</text>
    <text x="1005" y="219">Forgejo</text>
  </g>
  <g transform="translate(486 63)">
    <rect width="228" height="254" rx="34" fill="#0b1020" stroke="#7c3aed" stroke-width="3" filter="url(#glow)"/>
    <path d="M65 46h68l31 31v124a11 11 0 0 1-11 11H65a11 11 0 0 1-11-11V57a11 11 0 0 1 11-11Z" fill="#f8fafc"/>
    <path d="M133 46v24a9 9 0 0 0 9 9h22" fill="#94a3b8"/>
    <path d="M76 108h66M76 130h66M76 152h45" stroke="#6d28d9" stroke-width="8" stroke-linecap="round"/>
    <path d="m133 166 29 20-29 20v-13h-31v-14h31v-13Z" fill="#22d3ee" filter="url(#glow)"/>
  </g>
  <g fill="#f8fafc" font-family="ui-sans-serif,system-ui" text-anchor="middle">
    <text x="600" y="355" font-size="34" font-weight="800" letter-spacing="1">ONE CONFIG · EVERY FORGE</text>
    <text x="600" y="386" fill="#9aa6ba" font-size="16">Profiles · Projects · Organizations · Portable Markdown</text>
  </g>
</svg>
