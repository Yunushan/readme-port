    </filter>
  </defs>
  <rect x="9" y="9" width="142" height="142" rx="38" fill="#0b1020" stroke="#242d43" stroke-width="2"/>
  <path d="M31 45c-10 15-14 34-9 52 5 20 19 36 38 43" fill="none" stroke="url(#frame)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
