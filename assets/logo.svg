  <path d="M50 35h43l20 20v66a7 7 0 0 1-7 7H50a7 7 0 0 1-7-7V42a7 7 0 0 1 7-7Z" fill="url(#paper)"/>
  <path d="M93 35v17a5 5 0 0 0 5 5h15" fill="#94a3b8"/>
  <path d="M58 72h40M58 86h40M58 100h25" fill="none" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>
  <path d="m101 94 15 11-15 11v-7H87v-8h14v-7Z" fill="#06b6d4" filter="url(#glow)"/>
